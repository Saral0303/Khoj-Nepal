<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Have Information - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="app-layout">
    <main class="main-content" style="grid-column:1/-1;max-width:600px;margin:0 auto">
      <div class="page-header">
        <h1 data-i18n="infoTitle">I Have Information</h1>
        <p data-i18n="handoverExplain">Valuable found items go through Admin verification.</p>
      </div>
      <div class="post-form-container">
        <form id="have-info-form">
          <div class="form-group">
            <label data-i18n="infoSelectType">How can you help?</label>
            <div id="info-type-options" class="info-options"></div>
          </div>
          <div class="form-group">
            <label data-i18n="infoMessage">Short message</label>
            <textarea class="form-textarea" required placeholder="Share useful details�"></textarea>
          </div>
          <p class="form-note" data-i18n="trustAdmin">??? Claims are reviewed by authorized administrators.</p>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="infoSubmit">Submit Information</button>
          <a href="javascript:history.back()" class="btn btn-ghost btn-block mt-16" data-i18n="cancel">Cancel</a>
        </form>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <script th:if="${userJson != null}" id="server-user-data" type="application/json" th:utext="${userJson}"></script>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){initApp('have-info');});</script>
</body>
</html>
