<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="app-layout">
    <main class="main-content" style="grid-column:1/-1;max-width:680px;margin:0 auto">
      <div class="page-header">
        <h1 data-i18n="history">History</h1>
        <p class="form-note" data-i18n="historyHint">Your posts, claims, recovered items, and other activities will appear here.</p>
      </div>

      <h4 class="section-title" data-i18n="recentActivity">Recent Activity</h4>
      <div id="activity-list">
        <div th:if="${#lists.isEmpty(activities)}" class="empty-state">
          <p>No activity yet.</p>
        </div>
        <div th:unless="${#lists.isEmpty(activities)}">
          <div class="activity-item" th:each="act : ${activities}">
            <span th:text="${act.activityKey}">Activity</span>
            <span class="post-date" th:text="${act.timeLabel}">Time</span>
          </div>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script th:if="${userJson != null}" id="server-user-data" type="application/json" th:utext="${userJson}"></script>
  <script th:if="${activityJson != null}" id="server-activity-data" type="application/json" th:utext="${activityJson}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initApp('activity');
      var lostI = document.getElementById('history-lost-icon');
      var foundI = document.getElementById('history-found-icon');
      if (lostI) lostI.innerHTML = iconLost();
      if (foundI) foundI.innerHTML = iconFound();
    });
  </script>
</body>
</html>
