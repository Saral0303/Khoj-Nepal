<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-brand">
        <img src="/assets/logo.png" alt="Khoj Nepal" class="logo-main">
        <h1><span class="brand-khoj" style="color:#fff">Khoj</span> <span class="brand-nepal">Nepal</span></h1>
        <p class="tagline" data-i18n="tagline">Helping Nepal Find What Matters.</p>
        <p class="nepali-name">&#x0916;&#x094B;&#x091C; &#x0928;&#x0947;&#x092A;&#x093E;&#x0932;</p>
      </div>
      <div class="auth-form-side">
        <h2 data-i18n="forgotPasswordTitle">Forgot Password</h2>
        <p class="form-note mb-16" data-i18n="forgotPasswordHint">Enter the email or mobile number used for your Khoj Nepal account, then choose a new password.</p>

        <div id="forgot-error" class="form-error-box" style="display:none"></div>
        <div id="forgot-step1">
          <div class="form-group">
            <label data-i18n="emailOrMobile">Email or Mobile Number</label>
            <input type="text" class="form-input" id="forgot-identifier" autocomplete="username">
          </div>
          <button type="button" class="btn btn-primary btn-block" id="forgot-find-btn" data-i18n="continue">Continue</button>
        </div>
        <div id="forgot-otp-section" style="display:none">
          <p class="form-note mb-16" id="forgot-otp-msg" data-i18n="otpSentHint">A verification code has been sent to your email.</p>
          <div class="form-group">
            <label data-i18n="verificationCode">Verification Code</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="text" class="form-input" id="forgot-otp" maxlength="6" pattern="[0-9]{6}" placeholder="000000" autocomplete="one-time-code" style="flex:1">
              <button type="button" class="btn btn-primary btn-sm" id="forgot-verify-otp" data-i18n="verifyCode">Verify</button>
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="forgot-resend-otp" data-i18n="resendCode">Resend Code</button>
        </div>
        <div id="forgot-step2" style="display:none">
          <p class="form-note mb-16" id="forgot-account-msg"></p>
          <div class="form-group">
            <label data-i18n="newPassword">New Password</label>
            <input type="password" class="form-input" id="forgot-new-password" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label data-i18n="confirmPassword">Confirm Password</label>
            <input type="password" class="form-input" id="forgot-confirm-password" autocomplete="new-password">
          </div>
          <button type="button" class="btn btn-primary btn-block" id="forgot-reset-btn" data-i18n="resetPassword">Reset Password</button>
        </div>
        <p class="auth-footer"><a href="login.html" data-i18n="backToSignIn">Back to Sign In</a></p>
      </div>
    </div>
  </div>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initTheme();
      applyTranslations();
      initApp('forgot-password');
    });
  </script>
</body>
</html>
