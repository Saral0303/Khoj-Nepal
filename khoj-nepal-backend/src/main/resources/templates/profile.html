<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="app-layout">
    <main class="main-content" style="grid-column:1/-1;max-width:680px;margin:0 auto">
      <div class="profile-header-card" id="profile-header" th:if="${user != null}">
        <div class="profile-name" th:text="${user.fullName}">User Name</div>
        <div class="profile-detail">@<span th:text="${user.username}">username</span></div>
        <div class="profile-detail" th:text="${user.email}">email</div>
        <div class="profile-stats">
          <span>Points: <strong th:text="${user.points}">0</strong></span>
          <span>Reported: <strong th:text="${user.itemsReported}">0</strong></span>
          <span>Returned: <strong th:text="${user.itemsReturned}">0</strong></span>
        </div>
      </div>
      <div class="profile-private-card" id="profile-private-info">
        <h3>My Posts</h3>
        <div th:if="${#lists.isEmpty(myPosts)}" class="empty-state">
          <p>No posts yet.</p>
        </div>
        <div th:unless="${#lists.isEmpty(myPosts)}">
          <div class="post-card" th:each="post : ${myPosts}">
            <h4 th:text="${post.title}">Title</h4>
            <p th:text="${post.description}">Description</p>
            <span class="type-badge" th:classappend="${post.type == 'lost'} ? 'type-lost' : 'type-found'" th:text="${post.type}">Type</span>
            <span th:text="${post.status}">Status</span>
            <a th:href="@{/item-details(id=${post.id})}" class="btn btn-sm btn-ghost">View</a>
          </div>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script th:if="${userJson != null}" id="server-user-data" type="application/json" th:utext="${userJson}"></script>
  <script th:if="${myPostsJson != null}" id="server-my-posts-data" type="application/json" th:utext="${myPostsJson}"></script>
  <script th:if="${claimsJson != null}" id="server-claims-data" type="application/json" th:utext="${claimsJson}"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){initApp('profile');});</script>
</body>
</html>
