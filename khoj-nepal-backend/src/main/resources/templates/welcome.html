<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khoj Nepal - Welcome</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="welcome-page">
    <div class="welcome-card">
      <div class="welcome-logo-wrap">
        <img src="/assets/logo.png" alt="Khoj Nepal Logo" class="welcome-logo">
      </div>
      <h1><span class="brand-khoj">KHOJ</span> <span class="brand-nepal">NEPAL</span></h1>
      <p class="welcome-subtitle" data-i18n="subtitle">Lost & Found Management System</p>
      <p class="welcome-tagline" data-i18n="tagline">Helping Nepal Find What Matters.</p>
      <p class="welcome-nepali"><span class="brand-khoj">&#x0916;&#x094B;&#x091C;</span> <span class="brand-nepal">&#x0928;&#x0947;&#x092A;&#x093E;&#x0932;</span></p>
      <p data-i18n="chooseLang" style="margin-bottom:16px;color:var(--text-secondary)">Choose your language</p>
      <div class="lang-buttons">
        <button class="lang-btn" id="lang-en">
          <span data-i18n="english">English</span>
        </button>
        <button class="lang-btn" id="lang-ne">
          <span data-i18n="nepali">&#x0928;&#x0947;&#x092A;&#x093E;&#x0932;&#x0940;</span>
        </button>
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="btn-continue" data-i18n="continue">Continue</button>
    </div>
    <a href="help.html?from=welcome" class="welcome-help-btn">
      <span class="welcome-help-btn-icon" aria-hidden="true">?</span>
      <span data-i18n="help">Help</span>
    </a>
  </div>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function() { initTheme(); applyTranslations(); initApp('welcome'); });</script>
</body>
</html>
