<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovered Items - Khoj Nepal Admin</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-mobile-nav" id="admin-mobile-nav"></div>
      <div class="admin-header"><h1 data-i18n="adminRecovered">Recovered Items</h1></div>
      <div class="admin-table-card">
        <table class="admin-table">
          <thead><tr><th data-i18n="tableItem">Item</th><th data-i18n="tableStatus">Status</th><th data-i18n="tableDelivered">Delivered</th><th data-i18n="tableRetention">Retention</th></tr></thead>
          <tbody id="admin-recovered-body">
            <tr th:each="post : ${recoveredPosts}">
              <td th:text="${post.title}">Item</td>
              <td th:text="${post.status}">Status</td>
              <td th:text="${post.deliveredDate}">Delivered</td>
              <td th:text="${post.retentionDaysLeft != null} ? ${post.retentionDaysLeft} + ' days left' : ''">Retention</td>
            </tr>
            <tr th:if="${#lists.isEmpty(recoveredPosts)}">
              <td colspan="4" class="empty-state">No recovered items found.</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="form-note mt-16" data-i18n="trustRetention">?? Recovered records are retained temporarily for investigation.</p>
    </main>
  </div>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/admin.js"></script>
  <script th:if="${userJson != null}" id="server-user-data" type="application/json" th:utext="${userJson}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initAdminPage === 'function') { initAdminPage('recovered.html'); }
    });
  </script>
</body>
</html>
