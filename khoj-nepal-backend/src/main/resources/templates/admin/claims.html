<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Claims Review - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-mobile-nav" id="admin-mobile-nav"></div>
      <div class="admin-header"><h1 data-i18n="pendingClaims">Claim Review</h1></div>

      <div id="admin-claims-list">
        <div class="admin-table-card">
          <table class="admin-table">
            <thead>
              <tr><th data-i18n="tableItem">Item</th><th data-i18n="claimantInfo">Claimant</th><th data-i18n="tableStatus">Status</th><th data-i18n="tableKyc">KYC</th><th data-i18n="tableSubmitted">Submitted</th><th data-i18n="tableAction">Action</th></tr>
            </thead>
            <tbody id="admin-claims-body">
              <tr th:each="claim : ${claims}">
                <td th:text="${claim.itemTitle}">Item</td>
                <td th:text="${claim.claimantName}">Claimant</td>
                <td th:text="${claim.status}">Status</td>
                <td th:text="${claim.kycVerified} ? 'Verified' : 'Pending'">KYC</td>
                <td th:text="${claim.submittedDate}">Submitted</td>
                <td><a th:href="@{/admin/claims}" class="btn btn-sm btn-primary" data-i18n="review">Review</a></td>
              </tr>
              <tr th:if="${#lists.isEmpty(claims)}">
                <td colspan="6" class="empty-state">No claims found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="admin-claim-detail" hidden>
        <div id="claim-progress-admin" class="mb-16"></div>
      </div>
    </main>
  </div>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script defer src="/js/admin.js"></script>
  <script th:if="${userJson != null}" id="server-user-data" type="application/json" th:utext="${userJson}"></script>
  <script th:if="${adminClaimsJson != null}" id="server-admin-claims-data" type="application/json" th:utext="${adminClaimsJson}"></script>
  <script>document.addEventListener('DOMContentLoaded', function() { renderAdminClaimsList(); });</script>
</body>
</html>
