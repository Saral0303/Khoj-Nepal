<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Khoj Nepal Admin</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-mobile-nav" id="admin-mobile-nav"></div>
      <div class="admin-header"><h1 data-i18n="adminReports">Reports</h1></div>
      <div class="admin-table-card">
        <h3 data-i18n="adminOpenReports">Open Reviews</h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th data-i18n="tableReportId">ID</th><th data-i18n="tableType">Type</th><th data-i18n="tableRelated">Related</th><th data-i18n="tableUser">User</th><th data-i18n="tableDate">Date</th><th data-i18n="tableStatus">Status</th>
            </tr>
          </thead>
          <tbody id="admin-reports-body">
            <tr th:each="report : ${reports}">
              <td th:text="${report.id}">ID</td>
              <td th:text="${report.targetType}">Type</td>
              <td th:text="${report.targetId}">Related</td>
              <td th:text="${report.reporterId}">User</td>
              <td th:text="${report.createdAt}">Date</td>
              <td th:text="${report.status}">Status</td>
            </tr>
            <tr th:if="${#lists.isEmpty(reports)}">
              <td colspan="6" class="empty-state">No reports found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/admin.js"></script>
  <script th:if="${userJson != null}" id="server-user-data" type="application/json" th:utext="${userJson}"></script>
  <script th:if="${adminClaimsJson != null}" id="server-admin-claims-data" type="application/json" th:utext="${adminClaimsJson}"></script>
  <script>document.addEventListener('DOMContentLoaded', function() { renderAdminReportsDeep(); });</script>
</body>
</html>
