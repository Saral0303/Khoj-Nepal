<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="app-layout">
    <main class="main-content" style="grid-column:1/-1;max-width:600px;margin:0 auto">
      <div class="page-header">
        <h1 data-i18n="editProfile">Edit Profile</h1>
      </div>

      <div class="post-form-container">
        <form id="edit-profile-form">
          <div class="profile-pic-upload">
            <div class="profile-pic-preview" id="edit-avatar-preview">?</div>
            <div>
              <label class="btn btn-secondary btn-sm" for="edit-photo">Change Photo</label>
              <input type="file" id="edit-photo" accept="image/*" hidden>
            </div>
          </div>

          <div class="form-group">
            <label data-i18n="fullName">Full Name</label>
            <input type="text" class="form-input" id="edit-fullname">
          </div>
          <div class="form-group">
            <label data-i18n="username">Username</label>
            <div class="input-prefix">
              <span>@</span>
              <input type="text" class="form-input" id="edit-username">
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="dateOfBirth">Date of Birth</label>
            <input type="date" class="form-input" id="edit-dob">
          </div>
          <div class="form-group">
            <label data-i18n="mobileNumber">Mobile Number</label>
            <div class="input-prefix">
              <span>???? +977</span>
              <input type="tel" class="form-input" id="edit-mobile">
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="emailAddress">Email Address</label>
            <input type="email" class="form-input" id="edit-email">
          </div>
          <div class="form-group">
            <label data-i18n="province">Province</label>
            <select class="form-select" id="edit-province"></select>
          </div>
          <div class="form-group">
            <label data-i18n="district">District</label>
            <input type="text" class="form-input" id="edit-district">
          </div>
          <div class="form-group">
            <label data-i18n="city">City / Municipality</label>
            <input type="text" class="form-input" id="edit-city">
          </div>

          <button type="submit" class="btn btn-primary btn-block" data-i18n="saveChanges">Save Changes</button>
          <a href="profile.html" class="btn btn-ghost btn-block mt-16" data-i18n="cancel">Cancel</a>
        </form>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){initApp('edit-profile');});</script>
</body>
</html>
