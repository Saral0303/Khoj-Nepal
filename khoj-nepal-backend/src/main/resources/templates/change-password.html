<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="app-layout">
    <main class="main-content" style="grid-column:1/-1;max-width:480px;margin:0 auto">
      <div class="page-header">
        <h1 data-i18n="changePassword">Change Password</h1>
      </div>
      <div class="post-form-container">
        <form id="change-password-form">
          <div id="pw-error" class="form-error-box" style="display:none"></div>
          <div id="pw-success" class="privacy-notice" style="display:none" data-i18n="passwordUpdated">Password updated successfully.</div>
          <div class="form-group">
            <label data-i18n="currentPassword">Current Password</label>
            <input type="password" class="form-input" id="pw-current" required>
          </div>
          <div class="form-group">
            <label data-i18n="newPassword">New Password</label>
            <input type="password" class="form-input" id="pw-new" required>
          </div>
          <div class="form-group">
            <label data-i18n="confirmPassword">Confirm Password</label>
            <input type="password" class="form-input" id="pw-confirm" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="saveChanges">Save Changes</button>
          <a href="settings.html" class="btn btn-ghost btn-block mt-16" data-i18n="cancel">Cancel</a>
        </form>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initApp('settings');
      if (!getCurrentUser()) window.location.href = 'login.html';
      document.getElementById('change-password-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var err = document.getElementById('pw-error');
        var ok = document.getElementById('pw-success');
        err.style.display = 'none';
        ok.style.display = 'none';
        var neu = document.getElementById('pw-new').value;
        var confirm = document.getElementById('pw-confirm').value;
        if (neu !== confirm) {
          err.style.display = '';
          err.textContent = 'Passwords do not match.';
          return;
        }
        var result = changeCurrentPassword(document.getElementById('pw-current').value, neu);
        if (!result.ok) {
          err.style.display = '';
          err.textContent = result.error;
          return;
        }
        ok.style.display = '';
        e.target.reset();
      });
    });
  </script>
</body>
</html>
