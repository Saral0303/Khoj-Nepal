<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewards - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="app-layout">
    <main class="main-content" style="grid-column:1/-1;max-width:680px;margin:0 auto">
      <div class="rewards-hero">
        <p data-i18n="myPoints">? My Khoj Points</p>
        <div class="big-points" id="rewards-points">0</div>
        <p class="level" id="rewards-level">?? Bronze Helper</p>
        <p class="form-note mt-16" data-i18n="pointsEarnHint">Your points will increase when you successfully help return a found item to its rightful owner.</p>
      </div>

      <h3 data-i18n="contribution">Your Contribution</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-reported">0</div>
          <div class="stat-label" data-i18n="itemsReported">Items Reported</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-returned">0</div>
          <div class="stat-label" data-i18n="itemsReturned">Items Successfully Returned</div>
        </div>
      </div>

      <h3 class="mt-16" data-i18n="rewardLevels">Reward Levels</h3>
      <div class="level-list" id="level-list"></div>

    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){initApp('rewards');});</script>
</body>
</html>
