<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-brand">
        <img src="/assets/logo.png" alt="Khoj Nepal" class="logo-main">
        <h1><span class="brand-khoj" style="color:#fff">Khoj</span> <span class="brand-nepal">Nepal</span></h1>
        <p class="tagline" data-i18n="tagline">Helping Nepal Find What Matters.</p>
        <p class="nepali-name">??? ?????</p>
      </div>
      <div class="auth-form-side">
        <h2 data-i18n="signIn">Sign In</h2>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label data-i18n="emailOrMobile">Email or Mobile Number</label>
            <input type="text" class="form-input" id="login-identifier" autocomplete="username">
          </div>
          <div class="form-group">
            <label data-i18n="password">Password</label>
            <div class="password-field">
              <input type="password" class="form-input" id="login-password" autocomplete="current-password">
              <button type="button" class="password-toggle" data-target="login-password">Show</button>
            </div>
          </div>
          <div id="login-error" class="form-error-box" style="display:none"></div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="signIn">Sign In</button>
        </form>
        <p class="auth-footer"><a href="forgot-password.html" data-i18n="forgotPassword">Forgot Password?</a></p>
        <p class="auth-footer"><span data-i18n="createAccount">Create New Account</span> � <a href="signup.html" data-i18n="signUp">Sign Up</a></p>
        <p class="auth-footer auth-admin-link"><a href="admin/login.html" data-i18n="adminLogin">Admin Login</a></p>
      </div>
    </div>
    <a href="help.html?from=login" class="auth-help-link">
      <span class="welcome-help-btn-icon" aria-hidden="true">?</span>
      <span data-i18n="help">Help</span>
    </a>
  </div>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initTheme();
      applyTranslations();
      initApp('login');
      document.querySelectorAll('.password-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var input = document.getElementById(btn.dataset.target);
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.textContent = show ? 'Hide' : 'Show';
        });
      });
    });
  </script>
</body>
</html>
