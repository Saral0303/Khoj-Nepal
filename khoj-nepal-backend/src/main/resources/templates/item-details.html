<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('khoj_theme') || 'light';
        var bg = t === 'dark' ? '#18191A' : '#F2F3F5';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
        var s = document.createElement('style');
        s.id = 'khoj-theme-boot';
        s.textContent = 'html,body{background-color:' + bg + '!important;}';
        document.documentElement.appendChild(s);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#F2F3F5';
      }
    })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details - Khoj Nepal</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="app-layout">
    <aside class="sidebar-left" id="sidebar-left"></aside>
    <main class="main-content">
      <div class="detail-page">
        <div class="detail-card" id="item-detail-content" th:if="${post != null}">
          <div class="post-header">
            <div class="post-avatar" th:text="${post.userAvatar}">KN</div>
            <div class="post-meta">
              <div class="post-user" th:text="${post.userName}">User</div>
              <div class="post-date" th:text="${post.date}">Date</div>
            </div>
            <span class="type-badge" th:classappend="${post.type == 'lost'} ? 'type-lost' : 'type-found'" th:text="${post.type}">lost</span>
          </div>
          <h2 class="post-title" th:text="${post.title}">Title</h2>
          <p class="post-desc" th:text="${post.description}">Description</p>
          <div class="detail-info">
            <div class="detail-row"><strong>Location:</strong> <span th:text="${post.location}">Location</span></div>
            <div class="detail-row" th:if="${post.category}"><strong>Category:</strong> <span th:text="${post.category}">Category</span></div>
            <div class="detail-row" th:if="${post.subcategory}"><strong>Subcategory:</strong> <span th:text="${post.subcategory}">Subcategory</span></div>
            <div class="detail-row"><strong>Status:</strong> <span th:text="${post.status}">Status</span></div>
          </div>
          <div th:if="${post.image}" style="margin-top:16px">
            <img th:src="${post.image}" th:alt="${post.title}" style="max-width:100%;border-radius:8px">
          </div>
          <div th:if="${user != null and user.role == 'admin'}" style="margin-top:24px">
            <h3>Claims on this Post</h3>
            <div th:if="${#lists.isEmpty(claims)}" class="empty-state">
              <p>No claims yet.</p>
            </div>
            <div th:unless="${#lists.isEmpty(claims)}">
              <div class="claim-item" th:each="claim : ${claims}">
                <span th:text="${claim.claimantName}">Claimant</span> - <span th:text="${claim.status}">Status</span>
              </div>
            </div>
          </div>
        </div>
        <div class="detail-card" th:if="${post == null}">
          <div class="empty-state">
            <h3>Post not found</h3>
            <p>The requested post does not exist or is not available.</p>
          </div>
        </div>
      </div>
    </main>
    <aside class="sidebar-right" id="sidebar-right"></aside>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <script defer src="/js/mock-data.js"></script>
  <script defer src="/js/language.js"></script>
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/app.js"></script>
  <script th:if="${userJson != null}" id="server-user-data" type="application/json" th:utext="${userJson}"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){initApp('item-details');});</script>
</body>
</html>
